<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coffee Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f6dede;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            background: #3b0f1a;
            border-radius: 15px;
            padding: 30px 50px;
            color: #fff;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .menu a {
            margin-left: 25px;
            text-decoration: none;
            color: #ddd;
            font-size: 15px;
        }

        .menu a:hover {
            color: #f9b233;
        }

        /* HERO SECTION */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .hero-text {
            width: 50%;
        }

        .hero-text h4 {
            color: #f9b233;
            font-family: cursive;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .hero-text h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #f9b233;
            color: #3b0f1a;
            font-weight: bold;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
        }

        /* IMAGE */
        .hero-image {
            width: 45%;
            text-align: center;
        }

        .hero-image img {
            width: 100%;
            max-width: 350px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero-text,
            .hero-image {
                width: 100%;
                text-align: center;
            }

            .hero-text {
                margin-bottom: 30px;
            }

            .menu {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo"><h1>☕ Coffee</h1></div>
        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Menu</a>
            <a href="#">Testimonials</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
        </div>
    </div>
    <div class="hero">
        <div class="hero-text">
            <h4>Best Coffee</h4>
            <h1>Make your day great with our special coffee!</h1>
            <p>
                Welcome to our coffee paradise where every bean tells a story
                and every cup sparks joy.
            </p>

            <div class="buttons">
                <button class="btn btn-primary">Order Now</button>
                <button class="btn btn-outline">Contact Us</button>
            </div>
        </div>

        <div class="hero-image">
            <img src="https://i.imgur.com/1Q9Z1Zm.png" alt="Coffee Cup">
        </div>
    </div>

</div>

</body>
</html>
